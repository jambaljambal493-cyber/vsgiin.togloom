<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Үсгийн тоглоом</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Rubik:wght@600;800&family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Header with star count, three mode tabs, then the active game panel. */
:root {
  --bg: #eef3ff;
  --surface: #ffffff;
  --ink: #17254a;
  --muted: #5a688c;
  --line: #cfdaf5;
  --accent: #3d6df2;
  --on-accent: #ffffff;
  --star: #f2a900;
  --vowel-bg: #ffe2dc;
  --vowel-fg: #a8231a;
  --cons-bg: #dbe6ff;
  --cons-fg: #1d47c0;
  --good: #1f9d68;
  --good-bg: #d6f5e7;
  --bad: #d6403a;
  --bad-bg: #ffe0dd;
  --pad-bg: #cdf3df;
  --pad-fg: #0d6b45;
  --accent-deep: #2a50c4;
  --dot: #d8e2fb;
  --hero-tint: #dfe8ff;
  --sun: #ffd04d;
  --cloud: #ffffff;
  --hill1: #bfe8c4;
  --hill2: #9fd9ab;
  --ger: #ffffff;
  --gerroof: #dfe7fb;
  --horse: #8a5f3d;
  --sheep: #ffffff;
  --font-display: "Rubik", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111b36; --surface: #1a2850; --ink: #eaf0ff; --muted: #a2b1d8; --line: #2d3f75;
    --accent: #86a3ff; --on-accent: #0e1730; --star: #ffd04d;
    --vowel-bg: #4a2622; --vowel-fg: #ffb8ad; --cons-bg: #223a73; --cons-fg: #bccfff;
    --good: #4fd69b; --good-bg: #14463a; --bad: #ff8a82; --bad-bg: #55252a; --pad-bg: #14463a; --pad-fg: #9af0c6; --accent-deep: #4560c4; --dot: #1b2a55; --hero-tint: #24407f; --sun: #ffe08a; --cloud: #3a4f8f; --hill1: #1d3b45; --hill2: #17313a; --ger: #d9e2ff; --gerroof: #a9b8e8; --horse: #c79a72; --sheep: #e6ecff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111b36; --surface: #1a2850; --ink: #eaf0ff; --muted: #a2b1d8; --line: #2d3f75;
  --accent: #86a3ff; --on-accent: #0e1730; --star: #ffd04d;
  --vowel-bg: #4a2622; --vowel-fg: #ffb8ad; --cons-bg: #223a73; --cons-fg: #bccfff;
  --good: #4fd69b; --good-bg: #14463a; --bad: #ff8a82; --bad-bg: #55252a; --pad-bg: #14463a; --pad-fg: #9af0c6; --accent-deep: #4560c4; --dot: #1b2a55; --hero-tint: #24407f; --sun: #ffe08a; --cloud: #3a4f8f; --hill1: #1d3b45; --hill2: #17313a; --ger: #d9e2ff; --gerroof: #a9b8e8; --horse: #c79a72; --sheep: #e6ecff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.stars { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stars b { color: var(--star); font-size: 1.15em; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.tab { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; font-weight: 800; font-family: var(--font-display); font-size: 0.95rem; line-height: 1.2; min-height: 52px; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; }
.legend .lv::before { background: var(--vowel-bg); border: 2px solid var(--vowel-fg); }
.legend .lc::before { background: var(--cons-bg); border: 2px solid var(--cons-fg); }

/* Learn */
.detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(4.2rem, 22vw, 7rem); line-height: 1; padding: 10px 18px; border-radius: 20px; text-align: center; }
.big.v, .tile.v, .opt.v { background: var(--vowel-bg); color: var(--vowel-fg); }
.big.c, .tile.c, .opt.c { background: var(--cons-bg); color: var(--cons-fg); }
.word { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; margin: 0; overflow-wrap: anywhere; }
.word mark { background: none; color: var(--accent); }
.pic { font-size: 3.4rem; line-height: 1.1; }
.kind { color: var(--muted); font-weight: 700; font-size: 0.95rem; margin: 0; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; min-height: 44px; }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.tile { border: 3px solid transparent; border-radius: 14px; aspect-ratio: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; display: grid; place-items: center; }
.tile[aria-pressed="true"] { border-color: var(--ink); transform: scale(1.06); }

/* Quiz */
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 6px; background: var(--line); }
.dots i.done { background: var(--good); }
.dots i.now { background: var(--accent); }
.prompt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.prompt .ask { margin: 0; font-weight: 800; color: var(--muted); }
.prompt .target { font-family: var(--font-display); font-weight: 800; font-size: clamp(4.5rem, 24vw, 7.5rem); line-height: 1; color: var(--accent); }
.prompt .pic { font-size: clamp(4rem, 20vw, 6rem); }
.prompt .blank { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; }
.blank u { display: inline-block; min-width: 1.2em; border-bottom: 5px dashed var(--accent); text-decoration: none; color: transparent; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { border: 3px solid transparent; border-radius: 20px; min-height: 104px; font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; display: grid; place-items: center; }
.opt.ok { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.opt.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); animation: shake 0.35s; }
.opt:disabled { cursor: default; }
.opt.ok { animation: pop 0.4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 50% { transform: scale(1.08); } }
.level { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 700; color: var(--muted); }
.level .btn { padding: 6px 12px; min-height: 38px; }
.level .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.slots, .bank { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.blk, .slot { width: clamp(44px, 13vw, 64px); height: clamp(44px, 13vw, 64px); border-radius: 14px; }
.blk { border: 3px solid transparent; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 7vw, 2rem); display: grid; place-items: center; box-shadow: 0 4px 0 var(--line); }
.blk.v { background: var(--vowel-bg); color: var(--vowel-fg); }
.blk.c { background: var(--cons-bg); color: var(--cons-fg); }
.slot { border: 3px dashed var(--line); background: var(--bg); }
.slots.ok .blk { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.slots.shake { animation: shake 0.35s; }
.bankcard { min-height: 96px; display: flex; align-items: center; justify-content: center; }
.fillword { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 10vw, 2.8rem); line-height: 1.2; }
.gap { min-width: 1.1em; text-align: center; color: var(--accent); border-bottom: 5px dashed var(--accent); }
.gap.on { color: var(--good); border-bottom-style: solid; border-bottom-color: var(--good); }
.pairs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pc { aspect-ratio: 1; border-radius: 16px; border: 3px solid var(--accent); background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 9vw, 2.8rem); display: grid; place-items: center; touch-action: manipulation; }
.pc.up.v { background: var(--vowel-bg); color: var(--vowel-fg); border-color: var(--vowel-fg); }
.pc.up.c { background: var(--cons-bg); color: var(--cons-fg); border-color: var(--cons-fg); }
.pc.got { border-color: var(--good); }
.pophead { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 800; padding: 12px 18px; }
.ptarget { font-family: var(--font-display); font-size: 2.4rem; color: var(--accent); vertical-align: middle; }
.pcount { font-variant-numeric: tabular-nums; color: var(--muted); }
.field { position: relative; height: 360px; overflow: hidden; border-radius: 22px; border: 2px solid var(--line); background: var(--surface); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.bub { position: absolute; left: 0; top: 0; width: 68px; height: 68px; border-radius: 50%; border: 3px solid; font-family: var(--font-display); font-weight: 800; font-size: 2rem; display: grid; place-items: center; will-change: transform; }
.bub.v { background: var(--vowel-bg); color: var(--vowel-fg); border-color: var(--vowel-fg); }
.bub.c { background: var(--cons-bg); color: var(--cons-fg); border-color: var(--cons-fg); }
.bub.wrong { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.hdr-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 18px; }
.hero .letters { display: flex; gap: 10px; }
.hero .big { font-size: 3rem; padding: 8px 14px; }
.hero h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-weight: 700; max-width: 34ch; }
.start { font-size: 1.6rem; font-family: var(--font-display); font-weight: 800; padding: 14px 44px; min-height: 64px; border-radius: 18px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.mode { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mode b { font-family: var(--font-display); font-size: 1.1rem; }
.mode span { color: var(--muted); font-weight: 600; font-size: 0.92rem; }
.modes-title { margin: 0; font-weight: 800; color: var(--muted); }
.review { font-weight: 700; color: var(--muted); }
.review b { color: var(--accent); font-family: var(--font-display); }
.track { display: flex; gap: 6px; }
.track i { flex: 1; height: 32px; border-radius: 999px; background: var(--line); text-align: center; line-height: 32px; font-style: normal; font-size: 1.2rem; }
.track i.done { background: var(--pad-bg); }
.track i.now { background: var(--accent); }
.opts.pads { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pad { background: var(--pad-bg); color: var(--pad-fg); border-radius: 999px; min-height: 96px; font-size: 2.8rem; }
.pad:disabled:not(.ok) { opacity: 0.45; }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 12px; }
.result .row { font-size: 3.2rem; letter-spacing: 6px; color: var(--star); }
.result .row .off { color: var(--line); }
.result h2 { font-family: var(--font-display); margin: 0; font-size: 1.7rem; }
.result p { margin: 0; color: var(--muted); font-weight: 700; }
@media (max-width: 420px) {
  .detail { grid-template-columns: 1fr; justify-items: start; }
  h1 { font-size: 1.6rem; }
  .opt { font-size: 2.8rem; min-height: 92px; }
}
@media (prefers-reduced-motion: reduce) { .opt.no, .opt.ok, .tile { animation: none; transition: none; transform: none; } }

/* Гоёчлол: товойсон товч, нүүрний хөдөлгөөн, цацраг */
[hidden] { display: none !important; }
body { background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px); background-size: 22px 22px; }
h1 { display: flex; align-items: center; gap: 10px; }
.logo { display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 1.4rem; transform: rotate(-6deg); box-shadow: 0 4px 0 var(--accent-deep); }
.card { box-shadow: 0 6px 0 var(--line); }
.btn { box-shadow: 0 4px 0 var(--accent-deep); transition: transform 0.08s, box-shadow 0.08s; }
.btn.alt { box-shadow: 0 4px 0 var(--line); }
.tab { box-shadow: 0 4px 0 var(--line); transition: transform 0.08s, box-shadow 0.08s; }
.tab[aria-selected="true"] { box-shadow: 0 4px 0 var(--accent-deep); }
.tile, .opt, .pc, .blk { box-shadow: 0 5px 0 color-mix(in srgb, currentColor 30%, transparent); transition: transform 0.08s, box-shadow 0.08s; }
.pc:not(.up) { box-shadow: 0 5px 0 var(--accent-deep); }
.mode { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; align-items: center; box-shadow: 0 5px 0 var(--line); transition: transform 0.08s, box-shadow 0.08s; }
.btn:active, .tab:active, .mode:active, .opt:not(:disabled):active, .pc:active, .blk:active, .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.stars { box-shadow: 0 4px 0 var(--line); }
.stars.bump { animation: bump 0.5s; }
@keyframes bump { 30% { transform: scale(1.18) rotate(-3deg); } 60% { transform: scale(0.96); } }
.hero { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--surface) 30%, var(--hero-tint)); padding: 34px 18px 30px; }
.hero > * { position: relative; z-index: 1; }
.hero h2 { font-size: clamp(1.7rem, 7vw, 2.3rem); }
.hero .big { animation: bounce 2.2s ease-in-out infinite; box-shadow: 0 6px 0 color-mix(in srgb, currentColor 30%, transparent); }
.hero .big:nth-child(2) { animation-delay: 0.25s; }
.hero .big:nth-child(3) { animation-delay: 0.5s; }
.hero .start { box-shadow: 0 6px 0 var(--accent-deep); }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.hero .deco { position: absolute; z-index: 0; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; opacity: 0.35; animation: floaty 6s ease-in-out infinite; pointer-events: none; }
.deco.d1 { top: 10%; left: 5%; color: var(--vowel-fg); }
.deco.d2 { top: 14%; right: 6%; color: var(--cons-fg); animation-delay: -2s; }
.deco.d3 { bottom: 12%; left: 8%; color: var(--pad-fg); animation-delay: -4s; }
.deco.d4 { bottom: 16%; right: 7%; color: var(--star); animation-delay: -1s; }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
.modes { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.mode b, .mode span { grid-column: 2; }
.mode .badge { grid-column: 1; grid-row: span 2; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; background: var(--cons-bg); color: var(--cons-fg); }
.mode:nth-child(4n+1) .badge { background: var(--vowel-bg); color: var(--vowel-fg); }
.mode:nth-child(4n+3) .badge { background: var(--pad-bg); color: var(--pad-fg); }
.mode:nth-child(4n+4) .badge { background: color-mix(in srgb, var(--star) 28%, var(--surface)); color: var(--ink); }
.result .row { font-size: 4rem; animation: rise 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes rise { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.prompt .target { text-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 25%, transparent); }
.bgscene { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(110px, 22vh, 200px); z-index: -1; pointer-events: none; opacity: 0.75; }
.heroscene { position: absolute; left: 0; bottom: 0; width: 100%; height: 130px; z-index: 0; pointer-events: none; }
.hero { padding-bottom: 130px; }
.sec { margin: 6px 0 0; font-weight: 800; color: var(--muted); }
.grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.gchip { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; min-height: 48px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; box-shadow: 0 4px 0 var(--line); transition: transform 0.08s, box-shadow 0.08s; }
.gchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-deep); }
.gchip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.gname { flex: 1; text-align: center; color: var(--ink); min-width: 0; }
.qtext { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.25rem, 5.2vw, 1.8rem); line-height: 1.3; text-align: center; text-wrap: balance; overflow-wrap: anywhere; color: var(--ink); }
.qtext.qm { font-size: clamp(1.7rem, 7.5vw, 2.6rem); }
.mbwrap { display: flex; justify-content: center; margin-top: 10px; }
.mb { writing-mode: vertical-lr; font-family: "Noto Sans Mongolian", "Mongolian Baiti", "Menksoft Qagan", serif; font-weight: 400; font-size: 3.2rem; line-height: 1.3; color: var(--accent); }
.opts.t .opt { font-size: clamp(1.05rem, 4.4vw, 1.3rem); min-height: 76px; padding: 10px; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.level .btn:disabled { opacity: 0.4; cursor: default; }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.fx { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) {
  .hero .deco, .hero .big, .stars.bump, .result .row { animation: none; }
  .btn, .tab, .mode, .opt, .pc, .blk, .tile { transition: none; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="steppe" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice">
    <circle cx="660" cy="52" r="26" style="fill:var(--sun)"/>
    <g style="fill:var(--cloud)" opacity="0.9"><ellipse cx="110" cy="44" rx="26" ry="10"/><ellipse cx="130" cy="36" rx="18" ry="10"/><ellipse cx="92" cy="38" rx="16" ry="8"/></g>
    <g style="fill:var(--cloud)" opacity="0.85"><ellipse cx="420" cy="30" rx="24" ry="9"/><ellipse cx="438" cy="24" rx="16" ry="9"/></g>
    <path d="M0 150 Q120 92 260 136 T520 126 T800 140 V200 H0Z" style="fill:var(--hill1)"/>
    <g transform="translate(120 114)"><rect x="0" y="12" width="34" height="18" rx="2" style="fill:var(--ger)"/><path d="M-3 13 L17 0 L37 13Z" style="fill:var(--gerroof)"/><rect x="13" y="18" width="8" height="12" rx="1" style="fill:var(--accent)"/></g>
    <g transform="translate(162 120)"><rect x="0" y="12" width="28" height="15" rx="2" style="fill:var(--ger)"/><path d="M-3 13 L14 1 L31 13Z" style="fill:var(--gerroof)"/><rect x="10" y="17" width="7" height="10" rx="1" style="fill:var(--accent)"/></g>
    <g transform="translate(580 106)"><rect x="0" y="12" width="34" height="18" rx="2" style="fill:var(--ger)"/><path d="M-3 13 L17 0 L37 13Z" style="fill:var(--gerroof)"/><rect x="13" y="18" width="8" height="12" rx="1" style="fill:var(--accent)"/></g>
    <path d="M0 176 Q160 132 330 166 T640 160 T800 168 V200 H0Z" style="fill:var(--hill2)"/>
    <g transform="translate(450 146)" style="fill:var(--horse);stroke:var(--horse)"><ellipse cx="14" cy="10" rx="12" ry="6" stroke="none"/><path d="M22 6 L30 -4 L35 -2 L27 9Z" stroke="none"/><ellipse cx="36" cy="-2" rx="5" ry="3" stroke="none"/><path d="M7 14 V25 M11 14 V25 M19 14 V25 M23 14 V25" stroke-width="2" fill="none"/><path d="M2 8 Q-6 12 -4 20" stroke-width="2" fill="none"/></g>
    <g style="fill:var(--sheep)"><ellipse cx="290" cy="172" rx="8" ry="5"/><ellipse cx="312" cy="176" rx="8" ry="5"/><ellipse cx="334" cy="171" rx="8" ry="5"/><ellipse cx="700" cy="170" rx="8" ry="5"/><ellipse cx="722" cy="174" rx="8" ry="5"/></g>
    <g style="fill:var(--muted)"><circle cx="298" cy="171" r="2.6"/><circle cx="320" cy="175" r="2.6"/><circle cx="342" cy="170" r="2.6"/><circle cx="708" cy="169" r="2.6"/><circle cx="730" cy="173" r="2.6"/></g>
  </symbol>
</svg>
<svg class="bgscene" aria-hidden="true" focusable="false"><use href="#steppe" width="100%" height="100%"/></svg>
<div class="wrap">
  <header>
    <h1><span class="logo" aria-hidden="true">Үү</span>Үсгийн тоглоом</h1>
    <div class="hdr-right">
      <button class="btn alt" id="home" hidden>Нүүр</button>
      <div class="stars" aria-live="polite">Одод: <b>★</b> <span id="total">0</span></div>
    </div>
  </header>
  <div class="tabs" id="tabs" role="tablist" aria-label="Тоглоомын төрөл" hidden>
    <button class="tab" role="tab" data-mode="learn" aria-selected="true">Үсэг үзэх</button>
    <button class="tab" role="tab" data-mode="case" aria-selected="false">Том, жижиг</button>
    <button class="tab" role="tab" data-mode="first" aria-selected="false">Эхний үсэг</button>
    <button class="tab" role="tab" data-mode="jump" aria-selected="false">Үсэг үсрэх</button>
    <button class="tab" role="tab" data-mode="build" aria-selected="false">Үг бүтээх</button>
    <button class="tab" role="tab" data-mode="pairs" aria-selected="false">Хос олох</button>
    <button class="tab" role="tab" data-mode="pop" aria-selected="false">Бөмбөлөг</button>
    <button class="tab" role="tab" data-mode="fill" aria-selected="false">Дутуу үсэг</button>
  </div>
  <main id="panel" class="panel"></main>
</div>

<script>
// [letter, example word, picture]
var DATA = [
  ["А","алим","🍎"],["Б","банана","🍌"],["В","вагон","🚃"],["Г","гахай","🐖"],["Д","дугуй","🚲"],
  ["Е","ерөөл",""],["Ё","ёс",""],["Ж","жимс","🍇"],["З","загас","🐟"],["И","ирвэс","🐆"],
  ["Й","",""],["К","кино","🎬"],["Л","лаа","🕯️"],["М","муур","🐱"],["Н","нохой","🐶"],
  ["О","од","⭐"],["Ө","өндөг","🥚"],["П","пицца","🍕"],["Р","радио","📻"],["С","сар","🌙"],
  ["Т","тахиа","🐔"],["У","уул","⛰️"],["Ү","үхэр","🐄"],["Ф","футбол","⚽"],["Х","хонь","🐑"],
  ["Ц","цэцэг","🌸"],["Ч","чих","👂"],["Ш","шувуу","🐦"],["Щ","",""],["Ъ","",""],
  ["Ы","",""],["Ь","",""],["Э","эрдэнэ","💎"],["Ю","юм",""],["Я","ямаа","🐐"]
];
var VOWELS = "АЕЁИОӨУҮЫЭЮЯ";
var EASY = ["А","Б","М","Н","О","С","Т","У","Х","Э","Я","Р"];
var NOTE = { "Й": "Үгийн эхэнд ховор тохиолддог. Жишээ нь: «найз», «хайр».", "Щ": "Гадаад үгэнд тохиолдоно.", "Ъ": "Хатуулгын тэмдэг. Үг эхлэхгүй.", "Ы": "Үгийн дунд, сүүлд тохиолдоно. Жишээ нь: «ам ы»? Биш, «гэры», «бары» шиг.", "Ь": "Зөөлрүүлэх тэмдэг. Үг эхлэхгүй." };
NOTE["Ы"] = "Үгийн дунд, сүүлд тохиолдоно. Жишээ нь: «хоолны», «хүүхдийн».";

var byLetter = {}; DATA.forEach(function (d) { byLetter[d[0]] = d; });
var el = document.getElementById("panel");
var totalEl = document.getElementById("total");
var mode = "learn", cur = "А", level = "easy", quiz = null, total = 0, started = false;

try { total = parseInt(localStorage.getItem("ussgiin-stars") || "0", 10) || 0; } catch (e) {}
var shownTotal = null;
function saveTotal() {
  if (shownTotal !== null && total !== shownTotal) { var sb = document.querySelector(".stars"); if (sb) { sb.classList.remove("bump"); void sb.offsetWidth; sb.classList.add("bump"); } }
  shownTotal = total; totalEl.textContent = total; try { localStorage.setItem("ussgiin-stars", String(total)); } catch (e) {} }
saveTotal();

var hasVoice = false;
function checkVoices() { try { hasVoice = speechSynthesis.getVoices().some(function (v) { return /^mn/i.test(v.lang); }); } catch (e) { hasVoice = false; } if (mode === "learn") render(); }
try { speechSynthesis.addEventListener("voiceschanged", checkVoices); hasVoice = speechSynthesis.getVoices().some(function (v) { return /^mn/i.test(v.lang); }); } catch (e) {}
function say(t) { try { var u = new SpeechSynthesisUtterance(t); u.lang = "mn-MN"; u.rate = 0.8; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

// Дууны бичлэг: түлхүүр нь "L:А" (үсгийн нэр) эсвэл "W:А" (үг). Утга нь data: URI.
// Жишээ: CLIPS["W:А"] = "data:audio/mp4;base64,...";
var CLIPS = {};
function play(key, text) {
  if (CLIPS[key]) { try { new Audio(CLIPS[key]).play(); return; } catch (e) {} }
  say(text);
}
function loadMiss() { try { return JSON.parse(localStorage.getItem("ussgiin-miss") || "{}") || {}; } catch (e) { return {}; } }
function saveMiss(m) { try { localStorage.setItem("ussgiin-miss", JSON.stringify(m)); } catch (e) {} }
function bumpMiss(l, d) { var m = loadMiss(); m[l] = Math.max(0, (m[l] || 0) + d); saveMiss(m); }
function isV(l) { return VOWELS.indexOf(l) >= 0; }
function cls(l) { return isV(l) ? "v" : "c"; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pool() { var all = DATA.map(function (d) { return d[0]; }); return level === "easy" ? EASY : all; }
function picPool() { var base = DATA.filter(function (d) { return d[2]; }).map(function (d) { return d[0]; }); return level === "easy" ? base.filter(function (l) { return EASY.indexOf(l) >= 0; }) : base; }

function learnView() {
  var d = byLetter[cur], l = d[0], word = d[1];
  var wordHtml = word ? '<p class="word"><mark>' + word.charAt(0) + '</mark>' + word.slice(1) + '</p>' : '<p class="word">' + l + '</p>';
  var info = word ? "" : '<p class="kind">' + (NOTE[l] || "") + '</p>';
  var pic = d[2] ? '<div class="pic" aria-hidden="true">' + d[2] + '</div>' : "";
  var speak = (hasVoice || CLIPS["W:" + l] || CLIPS["L:" + l]) ? '<button class="btn alt" data-say="1">Сонсох</button>' : "";
  var tiles = DATA.map(function (x) {
    return '<button class="tile ' + cls(x[0]) + '" data-letter="' + x[0] + '" aria-pressed="' + (x[0] === cur) + '" aria-label="' + x[0] + ' үсэг">' + x[0] + '</button>';
  }).join("");
  return '<div class="card detail"><div class="big ' + cls(l) + '" aria-hidden="true">' + l + l.toLowerCase() + '</div><div>' +
    '<p class="kind">' + (isV(l) ? "Эгшиг үсэг" : (l === "Ъ" || l === "Ь" ? "Тэмдэг" : "Гийгүүлэгч үсэг")) + '</p>' + wordHtml + pic + info +
    '<div class="nav"><button class="btn alt" data-step="-1">Өмнөх</button><button class="btn" data-step="1">Дараах</button>' + speak + '</div></div></div>' +
    '<div class="legend"><span class="lv">Эгшиг</span><span class="lc">Гийгүүлэгч</span></div>' +
    '<div class="grid" role="group" aria-label="Монгол цагаан толгой, 35 үсэг">' + tiles + '</div>';
}

function levelBar() {
  return '<div class="level">Үсгийн тоо: <button class="btn alt" data-level="easy" aria-pressed="' + (level === "easy") + '">Амар (12)</button>' +
    '<button class="btn alt" data-level="all" aria-pressed="' + (level === "all") + '">Бүгд (35)</button></div>';
}

function newQuiz(kind) {
  if (kind === "fill") {
    var words = BWORDS.filter(function (x) { return level === "easy" ? x.w.length <= 4 : true; });
    var letters = DATA.map(function (d) { return d[0]; });
    var fq = shuffle(words).slice(0, 10).map(function (x) {
      var pos = Math.floor(Math.random() * x.w.length), t = x.w.charAt(pos);
      var others = shuffle(letters.filter(function (l) { return l !== t; })).slice(0, 3);
      return { t: t, word: x.w, pos: pos, pic: x.pic, opts: shuffle([t].concat(others)) };
    });
    quiz = { kind: kind, qs: fq, i: 0, first: 0, wrong: false, locked: false, done: false, review: [] };
    return;
  }
  var src = kind === "first" ? picPool() : pool();
  var miss = loadMiss();
  // Өмнө алдсан үсгээс 3 хүртэлийг энэ тоглолтод заавал оруулна.
  var review = Object.keys(miss).filter(function (l) { return src.indexOf(l) >= 0 && miss[l] > 0; })
    .sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 3);
  var rest = shuffle(src.filter(function (l) { return review.indexOf(l) < 0; }));
  var targets = shuffle(review.concat(rest).slice(0, 10));
  var all = DATA.map(function (d) { return d[0]; });
  var n = kind === "jump" ? 5 : 3;
  var qs = targets.map(function (t) {
    var others = shuffle(all.filter(function (x) { return x !== t; })).slice(0, n);
    return { t: t, opts: shuffle([t].concat(others)) };
  });
  quiz = { kind: kind, qs: qs, i: 0, first: 0, wrong: false, locked: false, done: false, review: review };
}

function quizView() {
  var dots = "", track = "";
  for (var k = 0; k < quiz.qs.length; k++) {
    var c = k < quiz.i ? "done" : k === quiz.i ? "now" : "";
    dots += '<i class="' + c + '"></i>';
    track += '<i class="' + c + '">' + (k === quiz.i && !quiz.done ? "🐸" : "") + '</i>';
  }
  if (quiz.done) {
    var s = quiz.first >= 9 ? 3 : quiz.first >= 6 ? 2 : 1, st = "";
    for (var n = 0; n < 3; n++) st += n < s ? "★" : '<span class="off">★</span>';
    return '<div class="card result"><div class="row" aria-label="' + s + ' од">' + st + '</div><h2>' + (s === 3 ? "Гайхалтай!" : s === 2 ? "Сайн байна!" : "Сайн оролдлоо!") + '</h2>' +
      '<p>Эхний оролдлогоор зөв: ' + quiz.first + ' / ' + quiz.qs.length + '</p><div class="nav"><button class="btn" data-again="1">Дахин тоглох</button></div></div>';
  }
  var q = quiz.qs[quiz.i], d = byLetter[q.t], prompt, opts;
  if (quiz.kind === "fill") {
    prompt = '<p class="ask">Дутуу үсгийг нөхөж үгийг гүйцээ</p><div class="pic" aria-hidden="true">' + q.pic + '</div><div class="fillword" aria-label="Үг, нэг үсэг дутуу">' +
      q.word.split("").map(function (ch, i) { return i === q.pos ? '<span class="gap" id="gap">?</span>' : '<span>' + ch + '</span>'; }).join("") + '</div>';
    opts = q.opts.map(function (o) { return '<button class="opt ' + cls(o) + '" data-pick="' + o + '" aria-label="' + o + ' үсэг">' + o + '</button>'; });
  } else if (quiz.kind === "jump") {
    prompt = '<p class="ask">Мэлхийг энэ үсэг дээр үсрүүл</p><div class="target" aria-label="' + q.t + ' үсэг">' + q.t + '</div>';
    opts = q.opts.map(function (o) { return '<button class="opt pad" data-pick="' + o + '" aria-label="' + o + ' үсэг">' + o + '</button>'; });
  } else if (quiz.kind === "case") {
    prompt ='<p class="ask">Том үсэгтэй адилхан жижиг үсгийг ол</p><div class="target" aria-label="' + q.t + ' үсэг">' + q.t + '</div>';
    opts = q.opts.map(function (o) { return '<button class="opt ' + cls(o) + '" data-pick="' + o + '" aria-label="' + o.toLowerCase() + '">' + o.toLowerCase() + '</button>'; });
  } else {
    var w = d[1];
    prompt = '<p class="ask">Энэ үг ямар үсгээр эхэлдэг вэ?</p><div class="pic" aria-hidden="true">' + d[2] + '</div>' +
      '<div class="blank"><u>' + w.charAt(0) + '</u>' + w.slice(1) + '</div>';
    opts = q.opts.map(function (o) { return '<button class="opt ' + cls(o) + '" data-pick="' + o + '" aria-label="' + o + ' үсэг">' + o + '</button>'; });
  }
  var review = quiz.review.length ? '<div class="review">Давтах үсэг: <b>' + quiz.review.join(", ") + '</b></div>' : "";
  var label = 'aria-label="Асуулт ' + (quiz.i + 1) + ' / ' + quiz.qs.length + '"';
  var bar = quiz.kind === "jump" ? '<div class="track" ' + label + '>' + track + '</div>' : '<div class="dots" ' + label + '>' + dots + '</div>';
  return (quiz.kind === "fill" ? buildLevelBar() : levelBar()) + review + bar + '<div class="card prompt">' + prompt + '</div><div class="opts' + (quiz.kind === "jump" ? " pads" : "") + '">' + opts.join("") + '</div>';
}

function startMode(m) {
  stopPop();
  if (m === "subj") newSubj();
  else if (m === "build") newBuild();
  else if (m === "pairs") newPairs();
  else if (m === "pop") newPop();
  else if (m !== "learn") newQuiz(m);
}
function resultHtml(stars, line) {
  var st = "";
  for (var n = 0; n < 3; n++) st += n < stars ? "★" : '<span class="off">★</span>';
  return '<div class="card result"><div class="row" aria-label="' + stars + ' од">' + st + '</div><h2>' + (stars === 3 ? "Гайхалтай!" : stars === 2 ? "Сайн байна!" : "Сайн оролдлоо!") + '</h2>' +
    '<p>' + line + '</p><div class="nav"><button class="btn" data-again="1">Дахин тоглох</button></div></div>';
}

// Хос олох: том ба жижиг үсгийн картыг тааруулна
var pr = null;
function newPairs() {
  var picks = shuffle(pool()).slice(0, 6), cards = [];
  picks.forEach(function (l, k) { cards.push({ pair: k, txt: l, ch: l }); cards.push({ pair: k, txt: l.toLowerCase(), ch: l }); });
  pr = { cards: shuffle(cards), n: picks.length, open: [], matched: {}, moves: 0, locked: false, done: false };
}
function pairsView() {
  if (pr.done) return resultHtml(pr.moves <= 8 ? 3 : pr.moves <= 11 ? 2 : 1, "Ходлого: " + pr.moves + " (хамгийн цөөн нь " + pr.n + ")");
  var cards = pr.cards.map(function (c, i) {
    var up = pr.open.indexOf(i) >= 0 || pr.matched[c.pair];
    return up ? '<button class="pc up ' + cls(c.ch) + (pr.matched[c.pair] ? " got" : "") + '" data-card="' + i + '" aria-label="' + c.txt + '">' + c.txt + '</button>'
      : '<button class="pc" data-card="' + i + '" aria-label="Хаалттай карт">?</button>';
  }).join("");
  var left = pr.n - Object.keys(pr.matched).length;
  return levelBar() + '<div class="review">Ходлого: <b>' + pr.moves + '</b> · Үлдсэн хос: <b>' + left + '</b></div>' +
    '<div class="card prompt"><p class="ask">Том үсэг ба түүний жижиг үсгийг олж хос болго</p></div><div class="pairs">' + cards + '</div>';
}
function pairsClick(b) {
  var i = parseInt(b.dataset.card, 10), me = pr, c = pr.cards[i];
  if (pr.locked || pr.open.indexOf(i) >= 0 || pr.matched[c.pair]) return;
  pr.open.push(i);
  if (pr.open.length < 2) { render(); return; }
  pr.moves++;
  var a = pr.cards[pr.open[0]], d = pr.cards[pr.open[1]];
  if (a.pair === d.pair) {
    burst(b, 12); pr.matched[a.pair] = true; pr.open = []; total++; saveTotal(); bumpMiss(a.ch, -1);
    if (Object.keys(pr.matched).length >= pr.n) pr.done = true;
    render();
  } else {
    pr.locked = true; render();
    setTimeout(function () { if (pr !== me) return; pr.open = []; pr.locked = false; render(); }, 900);
  }
}

// Бөмбөлөг хагалах: дээш хөвөх бөмбөлгөөс хэлсэн үсгийг дарна
var pp = null, REDUCED = false;
try { REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
function stopPop() { if (pp && pp.raf) { cancelAnimationFrame(pp.raf); pp.raf = 0; } }
function randLetter() { var p = pool(); return p[Math.floor(Math.random() * p.length)]; }
function newPop() { stopPop(); pp = { bs: [], target: randLetter(), popped: 0, goal: 10, mistakes: 0, done: false, raf: 0, last: 0, field: null, w: 0, h: 0 }; }
function bubbleLetter() {
  if (Math.random() < 0.35) return pp.target;
  var p = pool().filter(function (l) { return l !== pp.target; });
  return p[Math.floor(Math.random() * p.length)];
}
function setLetter(b, ch) { b.ch = ch; b.el.textContent = ch; b.el.className = "bub " + cls(ch); b.el.setAttribute("aria-label", ch + " үсэг"); }
function moveBubble(b) { b.el.style.transform = "translate(" + b.x + "px," + b.y + "px)"; }
function placeBubble(b, fresh) {
  var col = Math.floor(Math.random() * 4), span = Math.max(1, pp.w - 72) / 3;
  b.x = Math.max(0, Math.min(pp.w - 68, col * span + (Math.random() - 0.5) * 20));
  b.y = fresh ? pp.h + Math.random() * 60 : Math.random() * (pp.h - 72);
  b.v = (REDUCED ? 12 : 28) + Math.random() * (REDUCED ? 10 : 30);
  setLetter(b, bubbleLetter()); moveBubble(b);
}
function popView() {
  if (pp.done) return resultHtml(pp.mistakes <= 2 ? 3 : pp.mistakes <= 5 ? 2 : 1, "Алдсан дарилт: " + pp.mistakes);
  return levelBar() + '<div class="card pophead"><div>Дар: <b id="ptarget" class="ptarget">' + pp.target + '</b></div><div id="pcount" class="pcount">0 / ' + pp.goal + '</div></div>' +
    '<div class="field" id="field" aria-label="Бөмбөлгийн талбай"></div>';
}
function popStart() {
  var f = document.getElementById("field"); if (!f) return;
  pp.field = f; pp.w = f.clientWidth; pp.h = f.clientHeight; pp.bs = []; pp.last = 0;
  for (var i = 0; i < 8; i++) {
    var el = document.createElement("button"); el.dataset.bubble = String(i); f.appendChild(el);
    var b = { el: el }; pp.bs.push(b); placeBubble(b, false);
  }
  setLetter(pp.bs[0], pp.target); setLetter(pp.bs[1], pp.target);
  pp.raf = requestAnimationFrame(popTick);
}
function popTick(t) {
  if (!(started && mode === "pop" && pp && !pp.done && pp.field && document.body.contains(pp.field))) { if (pp) pp.raf = 0; return; }
  var dt = pp.last ? Math.min(0.05, (t - pp.last) / 1000) : 0; pp.last = t;
  pp.bs.forEach(function (b) { b.y -= b.v * dt; if (b.y < -80) placeBubble(b, true); else moveBubble(b); });
  pp.raf = requestAnimationFrame(popTick);
}
function popClick(b) {
  var bb = pp.bs[parseInt(b.dataset.bubble, 10)]; if (!bb) return;
  if (bb.ch === pp.target) {
    burst(b, 10); pp.popped++; total++; saveTotal(); bumpMiss(pp.target, -1);
    document.getElementById("pcount").textContent = pp.popped + " / " + pp.goal;
    placeBubble(bb, true);
    if (pp.popped >= pp.goal) { pp.done = true; stopPop(); render(); return; }
    if (pp.popped % 3 === 0) {
      pp.target = randLetter(); document.getElementById("ptarget").textContent = pp.target;
      setLetter(pp.bs[Math.floor(Math.random() * pp.bs.length)], pp.target);
    }
  } else {
    pp.mistakes++; bumpMiss(pp.target, 1); bb.el.classList.add("wrong");
    setTimeout(function () { bb.el.classList.remove("wrong"); }, 400);
  }
}

// Үг бүтээх горим: блок дарж үгийг өрнө
var BWORDS = DATA.filter(function (d) { return d[1] && d[2]; }).map(function (d) { return { w: d[1].toUpperCase(), pic: d[2] }; });
var wb = null;
function newBuild() {

  do { bank = shuffle(letters.map(function (ch, k) { return { id: k, ch: ch }; })); tries++; }
  while (tries < 6 && letters.length > 1 && bank.map(function (x) { return x.ch; }).join("") === letters.join(""));
  wb.letters = letters; wb.bank = bank;

}

    '<button class="btn alt" data-level="all" aria-pressed="' + (level === "all") + '">Бүгд</button></div>';

function buildView() {
  if (wb.done) {
    var s = wb.first >= 5 ? 3 : wb.first >= 3 ? 2 : 1, st = "";
    for (var n = 0; n < 3; n++) st += n < s ? "★" : '<span class="off">★</span>';
    return '<div class="card result"><div class="row" aria-label="' + s + ' од">' + st + '</div><h2>' + (s === 3 ? "Гайхалтай!" : s === 2 ? "Сайн байна!" : "Сайн оролдлоо!") + '</h2>' +
      '<p>Эхний оролдлогоор зөв: ' + wb.first + ' / ' + wb.ws.length + '</p><div class="nav"><button class="btn" data-again="1">Дахин тоглох</button></div></div>';
  }
  var cur = wb.ws[wb.i], dots = "";

  var slots = wb.slots.map(function (id, idx) {
    if (id === null) return '<span class="slot"></span>';
    var ch = wb.letters[id];
    return '<button class="blk ' + cls(ch) + '" data-slot="' + idx + '" aria-label="' + ch + ', буцаах">' + ch + '</button>';
  }).join("");

  var bank = wb.bank.filter(function (x) { return !placed[x.id]; }).map(function (x) {

    '<div class="slots' + (wb.ok ? " ok" : "") + (wb.shake ? " shake" : "") + '" aria-label="Үгийн нүднүүд">' + slots + '</div></div>' +
    '<div class="card bankcard"><div class="bank" aria-label="Үсгийн блокууд">' + (bank || '<span class="kind">Бүх блок байрлалаа</span>') + '</div></div>';
}
function buildClick(b) {
  if (wb.locked) return;
  if (b.dataset.bank !== undefined) {
    var p = wb.slots.indexOf(null); if (p < 0) return;
    wb.slots[p] = parseInt(b.dataset.bank, 10);
  } else { wb.slots[parseInt(b.dataset.slot, 10)] = null; }
  if (wb.slots.indexOf(null) >= 0) { render(); return; }
  var made = wb.slots.map(function (id) { return wb.letters[id]; }).join("");
  if (made === wb.ws[wb.i].w) {
    wb.ok = true; wb.locked = true; burst(b, 16);
    if (!wb.wrong) { wb.first++; total++; saveTotal(); }
    render();
    setTimeout(function () {
      wb.i++;
      if (wb.i >= wb.ws.length) { wb.done = true; wb.locked = false; wb.ok = false; } else setWord();
      render();
    }, 1000);
  } else {
    wb.wrong = true; wb.shake = true; wb.locked = true; render();
    setTimeout(function () {
      wb.slots = wb.slots.map(function () { return null; }); wb.shake = false; wb.locked = false; render();
    }, 700);
  }
}

var BL = [["ᠠ", "а"], ["ᠡ", "э"], ["ᠢ", "и"], ["ᠨ", "н"], ["ᠪ", "б"], ["ᠭ", "г"], ["ᠮ", "м"], ["ᠯ", "л"], ["ᠰ", "с"], ["ᠷ", "р"], ["ᠱ", "ш"], ["ᠴ", "ч"], ["ᠬ", "х"], ["ᠸ", "в"], ["ᠶ", "й"]];

function letterQ(L, set) { return ["Энэ үсэг кириллээр аль нь вэ? {mb:" + L[0] + "}", L[1], shuffle(set.filter(function (x) { return x[1] !== L[1]; })).slice(0, 3).map(function (x) { return x[1]; })]; }
function wordQ(W) { return ["Энэ үгийг кириллээр бичвэл? {mb:" + W[0] + "}", W[1], shuffle(BW.filter(function (x) { return x[1] !== W[1]; })).slice(0, 3).map(function (x) { return x[1]; })]; }
function biItems(g) {
  var set8 = BL.slice(0, 8);
  if (g <= 2) return shuffle(set8).map(function (L) { return letterQ(L, set8); });
  if (g <= 4) return shuffle(BW).map(wordQ);
  if (g <= 6) return shuffle(shuffle(BL).slice(0, 5).map(function (L) { return letterQ(L, BL); }).concat(shuffle(BW).slice(0, 5).map(wordQ)));
  return (g <= 9 ? BANK.bi.B : BANK.bi.C).map(function (r) { return [r[0], r[1], r.slice(2)]; });
}

function subjItems() {
  if (subjKey === "math") {
    var gens = MATH[grade], out = [], seen = {}, t = 0;
    while (out.length < 10 && t++ < 400) { var it = pk(gens)(); if (!seen[it[0]]) { seen[it[0]] = 1; out.push(it); } }
    return out;
  }
  if (subjKey === "bi") return biItems(grade);
  return shuffle(BANK[subjKey][grade]).map(function (r) { return [r[0], r[1], r.slice(2)]; });
}
function newSubj() {
  var qs = subjItems().slice(0, 10).map(function (it) { return { q: it[0], a: it[1], opts: shuffle([it[1]].concat(it[2])) }; });
  sq = { qs: qs, i: 0, first: 0, wrong: false, locked: false, done: false };
}
function subjView() {
  if (sq.done) { var r = sq.first / sq.qs.length; return resultHtml(r >= 0.9 ? 3 : r >= 0.6 ? 2 : 1, "Эхний оролдлогоор зөв: " + sq.first + " / " + sq.qs.length); }
  var q = sq.qs[sq.i], dots = "";
  for (var k = 0; k < sq.qs.length; k++) dots += '<i class="' + (k < sq.i ? "done" : k === sq.i ? "now" : "") + '"></i>';
  var opts = q.opts.map(function (o, i) { return '<button class="opt c t" data-spick="' + i + '">' + esc(o) + '</button>'; }).join("");
  return '<div class="level"><button class="btn alt" data-gstep="-1" aria-label="Өмнөх анги"' + (grade <= 1 ? " disabled" : "") + '>‹</button>' +
    '<b class="gname">' + grade + '-р анги · ' + SUBJ[subjKey] + '</b>' +
    '<button class="btn alt" data-gstep="1" aria-label="Дараах анги"' + (grade >= 12 ? " disabled" : "") + '>›</button></div>' +

    '<div class="card prompt"><div class="qtext' + (subjKey === "math" ? " qm" : "") + '">' + qHtml(q.q) + '</div></div><div class="opts t">' + opts + '</div>';
}
function subjClick(b) {
  if (sq.locked) return;
  var me = sq, q = sq.qs[sq.i], pick = q.opts[parseInt(b.dataset.spick, 10)];
  if (pick === q.a) {
    b.classList.add("ok"); burst(b, 14); sq.locked = true;
    document.querySelectorAll(".opt").forEach(function (o) { o.disabled = true; });
    if (!sq.wrong) { sq.first++; total++; saveTotal(); }
    setTimeout(function () { if (sq !== me) return; sq.i++; sq.wrong = false; sq.locked = false; if (sq.i >= sq.qs.length) sq.done = true; render(); }, 850);
  } else {
    sq.wrong = true; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); b.disabled = true;
  }
}

// Цацраг: зөв хариулт, шагналын үед
function burst(target, n) {
  if (REDUCED || !target || !target.getBoundingClientRect || !document.body.animate) return;
  var r = target.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var fx = document.getElementById("fx");
  if (!fx) { fx = document.createElement("div"); fx.id = "fx"; document.body.appendChild(fx); }
  var cs = getComputedStyle(document.documentElement);
  var colors = ["--accent", "--star", "--good", "--vowel-fg", "--cons-fg", "--bad"].map(function (k) { return cs.getPropertyValue(k).trim(); }).filter(Boolean);
  for (var i = 0; i < n; i++) {
    var p = document.createElement("span"), sz = 7 + Math.random() * 7;
    p.className = "fx";
    p.style.cssText = "width:" + sz + "px;height:" + sz * (Math.random() < 0.5 ? 1 : 0.6) + "px;background:" + colors[i % colors.length] + ";border-radius:" + (Math.random() < 0.5 ? "50%" : "2px") + ";left:" + cx + "px;top:" + cy + "px";
    fx.appendChild(p);
    var dx = (Math.random() - 0.5) * 280, up = -(50 + Math.random() * 150), rot = (Math.random() - 0.5) * 720;
    var a = p.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + dx * 0.6 + "px," + up + "px) rotate(" + rot / 2 + "deg)", opacity: 1, offset: 0.45 },
      { transform: "translate(" + dx + "px," + (up + 240) + "px) rotate(" + rot + "deg)", opacity: 0 }
    ], { duration: 800 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" });
    a.onfinish = (function (el) { return function () { el.remove(); }; })(p);
  }
}

function render() {
  document.getElementById("tabs").hidden = !started || mode === "subj";
  document.getElementById("home").hidden = !started;
  if (!started) { el.innerHTML = homeView(); return; }
  if (mode === "learn") el.innerHTML = learnView();
  else if (mode === "build") el.innerHTML = buildView();
  else if (mode === "pairs") el.innerHTML = pairsView();
  else if (mode === "pop") { el.innerHTML = popView(); if (!pp.done) popStart(); }
  else if (mode === "subj") el.innerHTML = subjView();
  else el.innerHTML = quizView();
  document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.mode === mode)); });
  var done = el.querySelector(".result .row"); if (done) burst(done, 44);
}

function setMode(m) {

}

el.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.start) { started = true; setMode(b.dataset.start); return; }

  if (b.dataset.grade) { grade = parseInt(b.dataset.grade, 10); saveGrade(); render(); return; }
  if (mode === "subj" && b.dataset.gstep) { grade = Math.max(1, Math.min(12, grade + parseInt(b.dataset.gstep, 10))); saveGrade(); newSubj(); render(); return; }
